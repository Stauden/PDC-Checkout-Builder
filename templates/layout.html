<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Checkout Sheet Builder">
    <meta name="author" content="Jordan Stauffer">
    <title>
      {% if title %}
        Checkout - {{ title }}
      {% else %}
        Checkout Builder
      {% endif %}
    </title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">

    <style>
      /* 1. Make Pico smaller (must come after the Pico link) */
      :root {
        --pico-font-size: 87.5%;
        --pico-line-height: 1.4;
        --pico-spacing: 0.6rem;
        --pico-form-element-spacing-vertical: 0.35rem;
        --pico-form-element-spacing-horizontal: 0.6rem;
      }

      /* 2. Form inputs in three columns (one column on narrow screens) */
      .fields {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0 1rem;
      }
      @media (max-width: 700px) {
        .fields { grid-template-columns: 1fr; }
      }

      /* 3. A row of buttons side by side ("compact" = smaller, for inside tables) */
      .actions {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-top: 1rem;
      }
      .actions form,
      .actions button,
      .actions a {
        margin: 0;
      }
      .actions.compact {
        gap: 0.4rem;
        margin-top: 0;
      }
      .actions.compact a[role="button"],
      .actions.compact button[type="submit"] {
        font-size: 0.85em;
        padding: 0.15rem 0.6rem;
      }

      /* 4. Buttons only as wide as their text */
      button[type="submit"] {
        width: auto;
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }

      /* 5. Tables: center rows, tighter cells, highlight the row being edited */
      td {
        vertical-align: middle;
      }
      table.elements th,
      table.elements td {
        padding: 4px 10px;
      }
      table.elements tr.editing td {
        background: rgba(255, 200, 0, 0.15);
      }
    </style>
  </head>
  <body>
    {% block content %}
    {% endblock content %}
  </body>
</html>
